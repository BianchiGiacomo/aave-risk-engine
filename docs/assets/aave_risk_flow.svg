<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">Aave-style Hub-Spoke risk engine flow</title>
  <desc id="desc">A diagram showing market stress and borrower books flowing into liquidation accounting, CVaR, and Hub-Spoke credit line allocation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="980" height="330" rx="24" fill="url(#bg)"/>
  <text x="42" y="56" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Aave-style collateral and Hub-Spoke risk engine</text>
  <text x="42" y="84" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Decision support for borrow caps, liquidation stress, and V4 credit-line allocation</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="42" y="130" width="170" height="86" rx="14" fill="#f8fafc"/>
    <text x="62" y="162" fill="#0f172a" font-size="17" font-weight="700">Inputs</text>
    <text x="62" y="187" fill="#334155" font-size="13">positions, LTV, LT</text>
    <text x="62" y="206" fill="#334155" font-size="13">vol, depth, rho</text>

    <rect x="282" y="130" width="185" height="86" rx="14" fill="#f8fafc"/>
    <text x="302" y="162" fill="#0f172a" font-size="17" font-weight="700">Stress scenarios</text>
    <text x="302" y="187" fill="#334155" font-size="13">Student-t / jumps</text>
    <text x="302" y="206" fill="#334155" font-size="13">peg + depth shock</text>

    <rect x="537" y="130" width="185" height="86" rx="14" fill="#f8fafc"/>
    <text x="557" y="162" fill="#0f172a" font-size="17" font-weight="700">Liquidations</text>
    <text x="557" y="187" fill="#334155" font-size="13">break-even slippage</text>
    <text x="557" y="206" fill="#334155" font-size="13">bad debt per scenario</text>

    <rect x="792" y="130" width="146" height="86" rx="14" fill="#f8fafc"/>
    <text x="812" y="162" fill="#0f172a" font-size="17" font-weight="700">Decision</text>
    <text x="812" y="187" fill="#334155" font-size="13">CVaR budget</text>
    <text x="812" y="206" fill="#334155" font-size="13">safe credit line</text>
  </g>

  <g stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M212 173 H282"/>
    <path d="M467 173 H537"/>
    <path d="M722 173 H792"/>
  </g>
  <g fill="#2dd4bf">
    <path d="M278 173 l-10 -7 v14 z"/>
    <path d="M533 173 l-10 -7 v14 z"/>
    <path d="M788 173 l-10 -7 v14 z"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="250" y="252" width="480" height="42" rx="21" fill="#0f766e" opacity="0.92"/>
    <text x="286" y="279" fill="#ecfeff" font-size="15" font-weight="700">V4 Hub mode: allocate shared liquidity by marginal Hub-CVaR</text>
  </g>
</svg>
